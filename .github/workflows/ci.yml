name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run Playwright E2E in this manual run"
        required: false
        default: "false"
      run_chromatic:
        description: "Run Chromatic in this manual run"
        required: false
        default: "false"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck + Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  tests:
    name: Unit + Integration + Contract
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: npm run test:integration

      - name: Contract tests
        run: npm run test:contract

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Coverage report
        run: npm run test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage

  storybook:
    name: Storybook Build + Coverage Check
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Story coverage check
        run: npm run check-story-coverage

      - name: Build Storybook
        run: npm run build-storybook

      - name: Upload Storybook artifact
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static

  next-build:
    name: Next.js Build
    runs-on: ubuntu-latest
    needs:
      - tests
      - storybook
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

  bundle-budget:
    name: Bundle Budget
    runs-on: ubuntu-latest
    needs: next-build
    env:
      MAX_FIRST_LOAD_JS_KB: "200"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and capture output
        run: npm run build | tee build.log

      - name: Enforce first-load JS budget
        run: |
          node -e '
          const fs = require("fs");
          const log = fs.readFileSync("build.log", "utf8");
          const m = log.match(/First Load JS shared by all\s+([0-9.]+)\s*(kB|MB)/i);
          if (!m) {
            console.error("Could not locate First Load JS shared by all in Next build output.");
            process.exit(1);
          }
          const size = Number(m[1]);
          const unit = m[2].toLowerCase();
          const sizeKb = unit === "mb" ? size * 1024 : size;
          const maxKb = Number(process.env.MAX_FIRST_LOAD_JS_KB || "200");
          console.log(`First Load JS shared by all: ${sizeKb.toFixed(2)} kB (budget: ${maxKb} kB)`);
          if (sizeKb > maxKb) {
            console.error(`Bundle budget exceeded by ${(sizeKb - maxKb).toFixed(2)} kB`);
            process.exit(1);
          }'

  e2e-nightly:
    name: E2E (Nightly / Manual)
    runs-on: ubuntu-latest
    needs: next-build
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_e2e == 'true')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser + OS dependencies
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

  chromatic:
    name: Chromatic
    runs-on: ubuntu-latest
    needs: storybook
    if: |
      (
        (github.event_name == 'push' || github.event_name == 'pull_request') &&
        secrets.CHROMATIC_PROJECT_TOKEN != ''
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.event.inputs.run_chromatic == 'true' &&
        secrets.CHROMATIC_PROJECT_TOKEN != ''
      )
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Chromatic
        run: npx chromatic --project-token=${{ secrets.CHROMATIC_PROJECT_TOKEN }}
